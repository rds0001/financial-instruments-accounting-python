name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q

  release-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test,dev]"
      - run: python -m ruff check src tests tools examples
      - run: python -m mypy --no-incremental src
      - run: python tools/verify_api_docs.py
      - run: python tools/verify_source_tree.py
      - run: python -m sphinx -W --keep-going -b html docs .work/docs-html
      - run: python -m sphinx -W --keep-going -b doctest docs .work/docs-doctest
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python tools/validate_distribution.py dist
      - name: Smoke-test installed wheel and sdist
        run: |
          python -m venv .work/wheel-venv
          .work/wheel-venv/bin/python -m pip install dist/*.whl
          mkdir -p .work/outside-wheel
          cd .work/outside-wheel
          ../wheel-venv/bin/python "$GITHUB_WORKSPACE/tools/smoke_installed.py" --workspace smoke --forbid-prefix "$GITHUB_WORKSPACE/src"
          cd "$GITHUB_WORKSPACE"
          python -m venv .work/sdist-venv
          .work/sdist-venv/bin/python -m pip install dist/*.tar.gz
          mkdir -p .work/outside-sdist
          cd .work/outside-sdist
          ../sdist-venv/bin/python "$GITHUB_WORKSPACE/tools/smoke_installed.py" --workspace smoke --forbid-prefix "$GITHUB_WORKSPACE/src"
