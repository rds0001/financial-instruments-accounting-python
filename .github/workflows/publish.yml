name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish signed-in provenance
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/financial-instruments-accounting
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python tools/validate_distribution.py dist
      - uses: pypa/gh-action-pypi-publish@release/v1
